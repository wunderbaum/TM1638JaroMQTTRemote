[platformio]
default_envs = esp32-c3-supermini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
  gavinlyonsrepo/TM1638plus@^1.7.0
  knolleary/PubSubClient@^2.8

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTM1638_STB=4
  -DTM1638_CLK=5
  -DTM1638_DIO=6
lib_deps =
  gavinlyonsrepo/TM1638plus@^1.7.0
  knolleary/PubSubClient@^2.8
